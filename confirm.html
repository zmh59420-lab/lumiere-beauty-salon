<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تأكيد الحجز | LUMIÈRE</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>


    <!-- ========================================
         HEADER
    ========================================= -->

    <header class="header">

        <a href="datetime.html" class="profile-btn">

            <i class="fa-solid fa-arrow-right"></i>

        </a>


        <div class="logo">

            <h1>
                LUMIÈRE
            </h1>

            <span>
                BEAUTY SALON
            </span>

        </div>


        <div style="width: 42px;"></div>

    </header>



    <!-- ========================================
         PAGE
    ========================================= -->

    <main class="booking-page">


        <!-- ========================================
             العنوان
        ========================================= -->

        <div class="booking-title">

            <span>
                الخطوة الأخيرة
            </span>

            <h1>
                تأكيد الحجز
            </h1>

            <p>
                راجعي تفاصيل موعدك قبل التأكيد
            </p>

        </div>



        <!-- ========================================
             الخطوات
        ========================================= -->

        <div class="booking-steps">


            <div class="step">

                <strong>

                    <i class="fa-solid fa-check"></i>

                </strong>

                <span>
                    الخدمة
                </span>

            </div>


            <div class="step">

                <strong>

                    <i class="fa-solid fa-check"></i>

                </strong>

                <span>
                    الموظفة
                </span>

            </div>


            <div class="step">

                <strong>

                    <i class="fa-solid fa-check"></i>

                </strong>

                <span>
                    الموعد
                </span>

            </div>


            <div class="step active">

                <strong>
                    4
                </strong>

                <span>
                    التأكيد
                </span>

            </div>


        </div>



        <!-- ========================================
             ملخص الحجز
        ========================================= -->

        <section class="confirmation-card">


            <div class="confirmation-icon">

                <i class="fa-regular fa-calendar-check"></i>

            </div>


            <h2>
                تفاصيل موعدك
            </h2>



            <!-- الخدمة -->

            <div class="confirmation-row">

                <div>

                    <span>
                        الخدمة
                    </span>

                    <strong id="confirmService">
                        -
                    </strong>

                </div>

                <i class="fa-solid fa-scissors"></i>

            </div>



            <!-- الموظفة -->

            <div class="confirmation-row">

                <div>

                    <span>
                        الموظفة
                    </span>

                    <strong id="confirmStaff">
                        -
                    </strong>

                </div>

                <i class="fa-regular fa-user"></i>

            </div>



            <!-- التاريخ -->

            <div class="confirmation-row">

                <div>

                    <span>
                        التاريخ
                    </span>

                    <strong id="confirmDate">
                        -
                    </strong>

                </div>

                <i class="fa-regular fa-calendar"></i>

            </div>



            <!-- الوقت -->

            <div class="confirmation-row">

                <div>

                    <span>
                        الوقت
                    </span>

                    <strong id="confirmTime">
                        -
                    </strong>

                </div>

                <i class="fa-regular fa-clock"></i>

            </div>



            <!-- السعر -->

            <div class="confirmation-price">

                <span>
                    الإجمالي
                </span>

                <div>

                    <strong id="confirmPrice">
                        0
                    </strong>

                    <span>
                        ر.س
                    </span>

                </div>

            </div>


        </section>



        <!-- ========================================
             ملاحظات للصالون
        ========================================= -->

        <section class="booking-notes-card">


            <div class="booking-notes-heading">


                <div class="booking-notes-icon">

                    <i class="fa-regular fa-message"></i>

                </div>


                <div>

                    <h3>
                        عندك ملاحظة للصالون؟
                    </h3>

                    <p>
                        هذا الحقل اختياري
                    </p>

                </div>


            </div>



            <div class="booking-notes-input">

                <textarea id="bookingNotes" maxlength="250"
                    placeholder="مثلاً: عندي مناسبة، أفضل قص بسيط من الأطراف..."></textarea>


                <div class="booking-notes-footer">

                    <span>
                        لن تؤثر الملاحظة على تأكيد الحجز
                    </span>

                    <span id="notesCounter">
                        0 / 250
                    </span>

                </div>

            </div>


        </section>



        <!-- ========================================
             زر تأكيد الحجز
        ========================================= -->

        <button type="button" id="confirmBookingBtn" class="continue-booking-btn">

            تأكيد الحجز

            <i class="fa-solid fa-check"></i>

        </button>


    </main>



    <!-- ========================================
         JAVASCRIPT
    ========================================= -->

    <script src="confirm.js"></script>


</body>

</html>
