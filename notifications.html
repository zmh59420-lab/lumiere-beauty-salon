<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إشعاراتي | LUMIÈRE</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>


    <!-- ========================================
         HEADER
    ========================================= -->

    <header class="header">

        <a href="index.html" class="profile-btn" aria-label="رجوع">

            <i class="fa-solid fa-arrow-right"></i>

        </a>


        <div class="logo">

            <h1>
                LUMIÈRE
            </h1>

            <span>
                BEAUTY SALON
            </span>

        </div>


        <div style="width: 42px;"></div>

    </header>



    <!-- ========================================
         NOTIFICATIONS PAGE
    ========================================= -->

    <main class="notifications-page">


        <!-- عنوان الصفحة -->

        <section class="notifications-heading">

            <div class="notifications-heading-icon">

                <i class="fa-regular fa-bell"></i>

            </div>


            <span>
                كل جديد يوصلكِ هنا
            </span>


            <h1>
                إشعاراتي
            </h1>


            <p>
                تابعي تحديثات حجوزاتك وتذكيرات مواعيدك
            </p>

        </section>



        <!-- ========================================
             TOP BAR
        ========================================= -->

        <section class="notifications-toolbar">


            <div>

                <span>
                    آخر التحديثات
                </span>

                <h2>
                    الإشعارات
                </h2>

            </div>


            <button type="button" id="markAllReadBtn" class="mark-all-read-btn">

                <i class="fa-solid fa-check-double"></i>

                تحديد الكل كمقروء

            </button>


        </section>



        <!-- ========================================
             NOTIFICATIONS LIST
        ========================================= -->

        <section class="notifications-list" id="notificationsList">

            <!-- الإشعارات تظهر هنا من JavaScript -->

        </section>



        <!-- ========================================
             EMPTY STATE
        ========================================= -->

        <section class="notifications-empty" id="notificationsEmpty">

            <div class="notifications-empty-icon">

                <i class="fa-regular fa-bell-slash"></i>

            </div>


            <h2>
                ما عندك إشعارات حالياً
            </h2>


            <p>
                عند وجود تحديث على حجوزاتك
                سيظهر لكِ هنا
            </p>


            <a href="booking.html" class="notifications-book-btn">

                احجزي موعداً

                <i class="fa-solid fa-arrow-left"></i>

            </a>

        </section>


    </main>



    <!-- ========================================
         BOTTOM NAVIGATION
    ========================================= -->

    <nav class="bottom-nav">


        <!-- الرئيسية -->

        <a href="index.html" class="nav-item">

            <i class="fa-solid fa-house"></i>

            <span>
                الرئيسية
            </span>

        </a>



        <!-- الخدمات -->

        <a href="booking.html" class="nav-item">

            <i class="fa-solid fa-border-all"></i>

            <span>
                الخدمات
            </span>

        </a>



        <!-- احجزي -->

        <a href="booking.html" class="nav-item booking">

            <div class="booking-icon">

                <i class="fa-solid fa-calendar-plus"></i>

            </div>

            <span>
                احجزي
            </span>

        </a>



        <!-- حجوزاتي -->

        <a href="appointments.html" class="nav-item">

            <i class="fa-regular fa-calendar-check"></i>

            <span>
                حجوزاتي
            </span>

        </a>



        <!-- حسابي -->

        <a href="profile.html" class="nav-item">

            <i class="fa-regular fa-user"></i>

            <span>
                حسابي
            </span>

        </a>


    </nav>



    <!-- ========================================
         JAVASCRIPT
    ========================================= -->

    <script src="notifications.js"></script>


</body>

</html>
