<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تم الحجز | LUMIÈRE</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <!-- ========================================
         HEADER
    ========================================= -->

    <header class="header">

        <div style="width: 42px;"></div>

        <div class="logo">
            <h1>LUMIÈRE</h1>
            <span>BEAUTY SALON</span>
        </div>

        <div style="width: 42px;"></div>

    </header>


    <!-- ========================================
         SUCCESS PAGE
    ========================================= -->

    <main class="booking-page">

        <section class="success-card">


            <!-- علامة النجاح -->

            <div class="success-icon">
                <i class="fa-solid fa-check"></i>
            </div>


            <span class="success-small-title">
                تم بنجاح
            </span>


            <h1>
                تم تأكيد حجزكِ
            </h1>


            <p class="success-message">
                نتطلع لرؤيتكِ قريباً في LUMIÈRE
            </p>


            <!-- ========================================
                 رقم الحجز
            ========================================= -->

            <div class="booking-number-box">

                <span>
                    رقم الحجز
                </span>

                <strong id="bookingNumber">
                    -
                </strong>

            </div>


            <!-- ========================================
                 تفاصيل الحجز
            ========================================= -->

            <div class="success-details">


                <!-- الخدمة -->

                <div class="success-detail-row">

                    <div class="success-detail-icon">
                        <i class="fa-solid fa-scissors"></i>
                    </div>

                    <div>
                        <span>الخدمة</span>
                        <strong id="successService">-</strong>
                    </div>

                </div>


                <!-- الموظفة -->

                <div class="success-detail-row">

                    <div class="success-detail-icon">
                        <i class="fa-regular fa-user"></i>
                    </div>

                    <div>
                        <span>الموظفة</span>
                        <strong id="successStaff">-</strong>
                    </div>

                </div>


                <!-- التاريخ -->

                <div class="success-detail-row">

                    <div class="success-detail-icon">
                        <i class="fa-regular fa-calendar"></i>
                    </div>

                    <div>
                        <span>التاريخ</span>
                        <strong id="successDate">-</strong>
                    </div>

                </div>


                <!-- الوقت -->

                <div class="success-detail-row">

                    <div class="success-detail-icon">
                        <i class="fa-regular fa-clock"></i>
                    </div>

                    <div>
                        <span>الوقت</span>
                        <strong id="successTime">-</strong>
                    </div>

                </div>

            </div>


            <!-- ========================================
                 السعر
            ========================================= -->

            <div class="success-price">

                <span>
                    إجمالي الحجز
                </span>

                <div>

                    <strong id="successPrice">
                        0
                    </strong>

                    <span>
                        ر.س
                    </span>

                </div>

            </div>


            <!-- ========================================
                 إضافة الموعد للتقويم
            ========================================= -->

            <div class="calendar-save-box">

                <div class="calendar-save-icon">
                    <i class="fa-regular fa-calendar-plus"></i>
                </div>

                <div class="calendar-save-text">

                    <strong>
                        لا تنسي موعدكِ
                    </strong>

                    <span>
                        أضيفي الحجز إلى تقويمك لتتذكري الموعد
                    </span>

                </div>

            </div>


            <!-- ========================================
                 الأزرار
            ========================================= -->

            <div class="success-buttons">


                <!-- إضافة للتقويم -->

                <button type="button" class="add-calendar-btn" id="addCalendarBtn">

                    <i class="fa-regular fa-calendar-plus"></i>

                    إضافة الموعد للتقويم

                </button>


                <!-- العودة للرئيسية -->

                <a href="index.html" class="success-home-btn">

                    <i class="fa-solid fa-house"></i>

                    العودة للرئيسية

                </a>


            </div>

        </section>

    </main>


    <!-- ========================================
         رسالة نجاح إضافة التقويم
    ========================================= -->

    <div class="calendar-toast" id="calendarToast">

        <div class="calendar-toast-icon">

            <i class="fa-solid fa-check"></i>

        </div>

        <div>

            <strong>
                تم تجهيز الموعد
            </strong>

            <span>
                افتحي ملف التقويم لإضافته إلى جهازك
            </span>

        </div>

    </div>


    <script src="success.js"></script>

</body>

</html>
