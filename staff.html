<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>اختيار الموظفة | LUMIÈRE</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>


    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="header">

        <a href="service-details.html" class="profile-btn">

            <i class="fa-solid fa-arrow-right"></i>

        </a>


        <div class="logo">

            <h1>LUMIÈRE</h1>

            <span>
                BEAUTY SALON
            </span>

        </div>


        <div style="width: 42px;"></div>

    </header>



    <!-- =========================================
         PAGE
    ========================================== -->

    <main class="booking-page">


        <!-- عنوان الصفحة -->

        <div class="booking-title">

            <span>
                الخطوة الثانية
            </span>

            <h1>
                اختاري الموظفة
            </h1>

            <p>
                اختاري الموظفة المناسبة لكِ لإكمال الحجز
            </p>

        </div>



        <!-- =========================================
             خطوات الحجز
        ========================================== -->

        <div class="booking-steps">


            <div class="step">

                <strong>
                    <i class="fa-solid fa-check"></i>
                </strong>

                <span>
                    الخدمة
                </span>

            </div>


            <div class="step active">

                <strong>
                    2
                </strong>

                <span>
                    الموظفة
                </span>

            </div>


            <div class="step">

                <strong>
                    3
                </strong>

                <span>
                    الموعد
                </span>

            </div>


            <div class="step">

                <strong>
                    4
                </strong>

                <span>
                    التأكيد
                </span>

            </div>


        </div>



        <!-- =========================================
             الخدمة المختارة
        ========================================== -->

        <div class="selected-booking-info">

            <span>
                الخدمة المختارة
            </span>

            <h3 id="selectedServiceName">
                -
            </h3>

            <p id="selectedServicePrice">
                -
            </p>

        </div>



        <!-- =========================================
             الموظفات
        ========================================== -->

        <section class="staff-section">

            <h2>
                من تفضلين؟
            </h2>

            <p>
                اختاري الموظفة التي ترغبين بحجز الموعد معها
            </p>


            <!--
                مهم:
                الموظفات ستتم إضافتهن هنا تلقائياً
                من لوحة الإدارة عن طريق staff.js
            -->

            <div class="staff-list" id="customerStaffList">

                <!-- الموظفات من JavaScript -->

            </div>


            <!-- =====================================
                 حالة عدم وجود موظفات
            ====================================== -->

            <div class="staff-empty-state" id="customerStaffEmpty" style="display: none;">

                <div class="staff-empty-icon">

                    <i class="fa-solid fa-user-group"></i>

                </div>


                <h3>
                    لا توجد موظفات متاحات حالياً
                </h3>


                <p>
                    يرجى المحاولة لاحقاً أو اختيار خدمة أخرى
                </p>


                <a href="booking.html" class="staff-empty-back">

                    <i class="fa-solid fa-arrow-right"></i>

                    العودة للخدمات

                </a>

            </div>

        </section>


    </main>


    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script src="staff.js"></script>


</body>

</html>
