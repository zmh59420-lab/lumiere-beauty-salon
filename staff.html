<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>اختيار الموظفة | LUMIÈRE</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>


    <!-- HEADER -->

    <header class="header">

        <a href="service-details.html" class="profile-btn">

            <i class="fa-solid fa-arrow-right"></i>

        </a>


        <div class="logo">

            <h1>LUMIÈRE</h1>

            <span>BEAUTY SALON</span>

        </div>


        <div style="width: 42px;"></div>

    </header>



    <!-- PAGE -->

    <main class="booking-page">


        <!-- عنوان الصفحة -->

        <div class="booking-title">

            <span>
                الخطوة الثانية
            </span>

            <h1>
                اختاري الموظفة
            </h1>

            <p>
                اختاري الموظفة المناسبة لكِ لإكمال الحجز
            </p>

        </div>



        <!-- خطوات الحجز -->

        <div class="booking-steps">


            <div class="step">

                <strong>
                    <i class="fa-solid fa-check"></i>
                </strong>

                <span>الخدمة</span>

            </div>


            <div class="step active">

                <strong>2</strong>

                <span>الموظفة</span>

            </div>


            <div class="step">

                <strong>3</strong>

                <span>الموعد</span>

            </div>


            <div class="step">

                <strong>4</strong>

                <span>التأكيد</span>

            </div>


        </div>



        <!-- الخدمة المختارة -->

        <div class="selected-booking-info">

            <span>
                الخدمة المختارة
            </span>

            <h3 id="selectedServiceName">
                -
            </h3>

            <p id="selectedServicePrice">
                -
            </p>

        </div>



        <!-- الموظفات -->

        <section class="staff-section">

            <h2>
                من تفضلين؟
            </h2>

            <p>
                اختاري الموظفة التي ترغبين بحجز الموعد معها
            </p>


            <div class="staff-list">


                <!-- الموظفة 1 -->

                <button class="staff-card" type="button" data-staff="سارة">

                    <div class="staff-avatar">

                        <i class="fa-regular fa-user"></i>

                    </div>

                    <div class="staff-info">

                        <h3>
                            سارة
                        </h3>

                        <span>
                            أخصائية تجميل
                        </span>

                    </div>

                    <i class="fa-solid fa-chevron-left"></i>

                </button>



                <!-- الموظفة 2 -->

                <button class="staff-card" type="button" data-staff="نورة">

                    <div class="staff-avatar">

                        <i class="fa-regular fa-user"></i>

                    </div>

                    <div class="staff-info">

                        <h3>
                            نورة
                        </h3>

                        <span>
                            أخصائية تجميل
                        </span>

                    </div>

                    <i class="fa-solid fa-chevron-left"></i>

                </button>



                <!-- الموظفة 3 -->

                <button class="staff-card" type="button" data-staff="ريم">

                    <div class="staff-avatar">

                        <i class="fa-regular fa-user"></i>

                    </div>

                    <div class="staff-info">

                        <h3>
                            ريم
                        </h3>

                        <span>
                            أخصائية تجميل
                        </span>

                    </div>

                    <i class="fa-solid fa-chevron-left"></i>

                </button>


            </div>

        </section>


    </main>


    <script src="staff.js"></script>


</body>

</html>
